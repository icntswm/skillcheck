# Temporary: checks the action's summary, outputs and PR comment on a real PR.
# A fake claude always loads find-bug, so no model calls and no token.
name: try comment

on:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP"
      - name: fake claude
        run: |
          dir="$RUNNER_TEMP/fake"
          mkdir -p "$dir"
          cat > "$dir/run.jsonl" <<'JSONL'
          {"type":"system","subtype":"init","session_id":"s","skills":["api-docs","changelog","db-migrations","find-bug","perf-profile","test-guard"]}
          {"type":"assistant","message":{"content":[{"type":"tool_use","id":"t1","name":"Skill","input":{"skill":"find-bug"}}]},"session_id":"s"}
          {"type":"result","subtype":"success","result":"ok","total_cost_usd":0.01,"session_id":"s"}
          JSONL
          sed -i 's/^ *//' "$dir/run.jsonl"
          printf '#!/bin/sh\nFAKE_FIXTURE=%s exec node %s "$@"\n' "$dir/run.jsonl" "$GITHUB_WORKSPACE/test/bin/fake-claude.mjs" > "$dir/claude"
          chmod +x "$dir/claude"
          echo "$dir" >> "$GITHUB_PATH"
      - id: sc
        uses: ./
        with:
          file: examples/demo/skillcheck.yaml
          skills-dir: examples/demo/skills
          version: file:${{ runner.temp }}/icntswm-skillcheck-1.0.4.tgz
      - if: always()
        run: |
          which claude
          echo "passed=${{ steps.sc.outputs.passed }} failed=${{ steps.sc.outputs.failed }} skipped=${{ steps.sc.outputs.skipped }} cost=${{ steps.sc.outputs.cost }} markdown=${{ steps.sc.outputs.markdown }}"
