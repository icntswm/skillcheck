name: Skill routing tests for Claude Code
description: Regression tests for Claude Code skills. Checks that every request still loads the right skill.
branding:
  icon: check-circle
  color: orange

# Auth: pass ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in the step's env:.
inputs:
  file:
    description: Cases file.
    default: skillcheck.yaml
  skills-dir:
    description: >
      Directory with the skills under test. They are copied into an isolated
      Claude Code config dir, so the run sees only them. Empty uses the
      runner's own config.
    default: skills
  lint:
    description: Run the free lint step first.
    default: "true"
  run:
    description: Run the cases against the model (costs model calls).
    default: "true"
  batch:
    description: One model call per 25 cases instead of one per case.
    default: "false"
  model:
    description: Model passed to Claude Code. Empty uses the suite's model.
    default: ""
  repeat:
    description: Runs per case. Empty uses the suite's value.
    default: ""
  threshold:
    description: Share of runs a case must pass. Empty uses the suite's value.
    default: ""
  budget:
    description: Stop starting new runs once the spend estimate reaches this many USD.
    default: "5"
  baseline:
    description: Path to an earlier --json report to compare with; skipped when the file does not exist.
    default: ""
  junit:
    description: Path for the JUnit XML report. Empty disables it.
    default: skillcheck.xml
  args:
    description: Extra arguments for skillcheck run, split on whitespace (quotes are not parsed).
    default: ""
  comment:
    description: >
      Post the report as a pull request comment and update it on every run.
      The job needs pull-requests: write; without it the step only warns.
    default: "true"
  github-token:
    description: Token for the pull request comment.
    default: ${{ github.token }}
  version:
    description: "@icntswm/skillcheck version to install."
    default: latest
  claude-code-version:
    description: "@anthropic-ai/claude-code version to install."
    default: latest

outputs:
  passed:
    description: Cases that passed.
    value: ${{ steps.report.outputs.passed }}
  failed:
    description: Cases that failed.
    value: ${{ steps.report.outputs.failed }}
  skipped:
    description: Cases skipped by the budget.
    value: ${{ steps.report.outputs.skipped }}
  cost:
    description: Spend in USD, with runs that reported no cost estimated from tokens.
    value: ${{ steps.report.outputs.cost }}
  json:
    description: Path to the JSON report.
    value: ${{ steps.report.outputs.json }}
  markdown:
    description: Path to the Markdown report, also shown in the job summary.
    value: ${{ steps.report.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: install
      shell: bash
      env:
        SC_VERSION: ${{ inputs.version }}
        CC_VERSION: ${{ inputs.claude-code-version }}
      run: npm install -g "@anthropic-ai/claude-code@$CC_VERSION" "@icntswm/skillcheck@$SC_VERSION"

    - name: config dir
      if: inputs.skills-dir != ''
      shell: bash
      env:
        SKILLS_DIR: ${{ inputs.skills-dir }}
      run: |
        dir="$RUNNER_TEMP/skillcheck-config"
        mkdir -p "$dir/skills"
        cp -R "$SKILLS_DIR/." "$dir/skills/"
        echo "SKILLCHECK_CONFIG_DIR=$dir" >> "$GITHUB_ENV"

    - name: lint
      if: inputs.lint == 'true'
      shell: bash
      env:
        FILE: ${{ inputs.file }}
      run: |
        args=(lint "$FILE")
        [ -n "$SKILLCHECK_CONFIG_DIR" ] && args+=(--config-dir "$SKILLCHECK_CONFIG_DIR")
        skillcheck "${args[@]}"

    - name: run
      if: inputs.run == 'true'
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        BATCH: ${{ inputs.batch }}
        MODEL: ${{ inputs.model }}
        REPEAT: ${{ inputs.repeat }}
        THRESHOLD: ${{ inputs.threshold }}
        BUDGET: ${{ inputs.budget }}
        BASELINE: ${{ inputs.baseline }}
        JUNIT: ${{ inputs.junit }}
        EXTRA: ${{ inputs.args }}
      run: |
        args=(run "$FILE")
        [ -n "$SKILLCHECK_CONFIG_DIR" ] && args+=(--config-dir "$SKILLCHECK_CONFIG_DIR")
        [ "$BATCH" = "true" ] && args+=(--batch)
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        [ -n "$REPEAT" ] && args+=(--repeat "$REPEAT")
        [ -n "$THRESHOLD" ] && args+=(--threshold "$THRESHOLD")
        [ -n "$BUDGET" ] && args+=(--budget "$BUDGET")
        [ -n "$JUNIT" ] && args+=(--junit "$JUNIT")
        args+=(--json "$RUNNER_TEMP/skillcheck.json")
        # a pinned version older than 1.1.0 has no Markdown report
        # grep reads it all: with -q it would exit early and fail the pipe under pipefail
        if skillcheck --help | grep -- --markdown > /dev/null; then args+=(--markdown "$RUNNER_TEMP/skillcheck.md"); fi
        compare=false
        if [ -n "$BASELINE" ]; then
          if [ -f "$BASELINE" ]; then
            if skillcheck --help | grep -- --baseline > /dev/null; then
              args+=(--baseline "$BASELINE")
              compare=true
            else
              echo "::warning::this skillcheck version has no --baseline, running without the comparison"
            fi
          else
            echo "::notice::no baseline at $BASELINE, running without"
          fi
        fi
        read -ra extra <<< "$EXTRA"
        for arg in "${extra[@]}"; do
          case "$arg" in --baseline|--baseline=*) compare=true ;; esac
        done
        # --only-new-failures needs a baseline: without one every failure counts
        if [ "$compare" = false ]; then
          kept=()
          for arg in "${extra[@]}"; do
            if [ "$arg" = --only-new-failures ]; then
              echo "::notice::no baseline to compare with, --only-new-failures is ignored"
            else
              kept+=("$arg")
            fi
          done
          extra=("${kept[@]}")
        fi
        skillcheck "${args[@]}" "${extra[@]}"

    - name: report
      id: report
      if: always() && inputs.run == 'true'
      shell: bash
      run: |
        json="$RUNNER_TEMP/skillcheck.json"
        md="$RUNNER_TEMP/skillcheck.md"
        # no report means the run never got to the cases: bad config or no login
        [ -f "$json" ] || exit 0
        node -e '
          const s = require(process.argv[1]).summary;
          console.log(`passed=${s.cases - s.failed - s.skipped}`);
          console.log(`failed=${s.failed}`);
          console.log(`skipped=${s.skipped}`);
          console.log(`cost=${s.estimatedCostUsd.toFixed(4)}`);
        ' "$json" >> "$GITHUB_OUTPUT"
        echo "json=$json" >> "$GITHUB_OUTPUT"
        if [ -f "$md" ]; then
          echo "markdown=$md" >> "$GITHUB_OUTPUT"
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: comment
      if: always() && steps.report.outputs.markdown != '' && inputs.comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MD: ${{ steps.report.outputs.markdown }}
      run: |
        body="$RUNNER_TEMP/skillcheck-comment.md"
        # GitHub rejects comments over 65536 characters
        if [ "$(wc -c < "$MD")" -gt 60000 ]; then
          { head -c 60000 "$MD"; printf '\n\n…cut; the full report is in the job summary.\n'; } > "$body"
        else
          cp "$MD" "$body"
        fi
        # the report starts with a marker, so a rerun edits its comment instead of adding one
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- skillcheck -->")) | .id' | tail -n 1) || id=""
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
        fi || echo "::warning::skillcheck could not comment on the pull request; the job needs pull-requests: write (forks never get it)"
